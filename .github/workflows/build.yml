name: Build and release APK

# Every push to main builds a signed release APK and publishes it as a GitHub Release
# tagged build-<versionCode>, with the APK attached as taycan-screen.apk.
# The app's "Check for update" button reads the latest of these releases.
# Pushes to other branches and pull requests only build (no release).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Auto-incremented on every run. The offset keeps numbers above any earlier test builds.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Signing secrets SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD are not set. See README.md."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=taycan" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          VC=$((100 + VERSION_CODE))
          echo "VC=$VC" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease -PversionCode=$VC -PgithubRepo=${{ github.repository }}
          cp app/build/outputs/apk/release/app-release.apk taycan-screen.apk

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs taycan-screen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: taycan-screen-build-${{ env.VC }}
          path: taycan-screen.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=format:'%s%n%n%b' > notes.txt
          gh release create "build-$VC" taycan-screen.apk \
            --title "Build $VC" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
