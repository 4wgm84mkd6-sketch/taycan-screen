name: Build and release APK

# Every push to main builds a signed release APK and publishes it as a GitHub Release
# tagged build-<versionCode>, with the APK attached as taycan-screen.apk.
# The app's "Check for update" button reads the latest of these releases.
# Pushes to other branches and pull requests only build (no release).

on:
  push:
    # Docs and reference material alone don't need a new build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reference/**"
      - "design/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Auto-incremented on every run. The offset keeps numbers above any earlier test builds.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decrypt signing key
        id: key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::Repository secret SIGNING_PASSWORD is not set yet: building unsigned to check the code, no release. See README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ignore spaces/line breaks pasted along with the secret.
          SIGNING_PASSWORD=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$SIGNING_PASSWORD"
          if printf '%s' "$SIGNING_PASSWORD" | grep -qE '^[0-9a-f]+$'; then KIND=hex; else KIND="not hex"; fi
          echo "Signing password: ${#SIGNING_PASSWORD} characters, $KIND (expected 48, hex)"
          export SIGNING_PASSWORD
          # signing/release.jks.enc is the release keystore, AES-256 encrypted with SIGNING_PASSWORD.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:SIGNING_PASSWORD
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=taycan" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Speed limits for the map, built into the APK so they work without internet (the public
      # Overpass servers time out from the car). Source: Geofabrik's daily OpenStreetMap extract of
      # Hawaii. If this step fails the app falls back to asking Overpass online.
      - name: Day stamp
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: osm/hawaii-latest.osm.pbf
          key: osm-hawaii-${{ steps.day.outputs.day }}

      - name: Offline speed limits
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq osmium-tool > /dev/null
          mkdir -p osm app/src/main/assets
          [ -s osm/hawaii-latest.osm.pbf ] || curl -fsSL --retry 3 -o osm/hawaii-latest.osm.pbf \
            https://download.geofabrik.de/north-america/us/hawaii-latest.osm.pbf
          STAMP=$(osmium fileinfo -g header.option.osmosis_replication_timestamp osm/hawaii-latest.osm.pbf || true)
          osmium tags-filter --overwrite osm/hawaii-latest.osm.pbf w/maxspeed -o osm/maxspeed.osm.pbf
          osmium export --overwrite osm/maxspeed.osm.pbf -f geojsonseq --geometry-types=linestring -o osm/maxspeed.geojsonseq
          python3 tools/speedlimits.py osm/maxspeed.geojsonseq app/src/main/assets/speedlimits.txt "${STAMP:-unknown}"
          ls -la app/src/main/assets/speedlimits.txt

      - name: Build release APK
        run: |
          VC=$((100 + VERSION_CODE))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle --no-daemon testReleaseUnitTest assembleRelease -PversionCode=$VC -PgithubRepo=${{ github.repository }}
          if [ "${{ steps.key.outputs.ready }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk taycan-screen.apk
          fi

      - name: Verify signature
        if: steps.key.outputs.ready == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs taycan-screen.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: taycan-screen-build-${{ env.VC }}
          path: taycan-screen.apk

      - name: Publish GitHub Release
        if: steps.key.outputs.ready == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=format:'%s%n%n%b' > notes.txt
          gh release create "build-$VC" taycan-screen.apk \
            --title "Build $VC" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
